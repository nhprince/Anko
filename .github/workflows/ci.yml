name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"  # belt-and-suspenders: code already forces UTF-8 stdout, this covers the whole job
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Engine tests
        run: python tests/test_engine.py

      - name: UI smoke test
        run: python tests/test_ui_smoke.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Flow tests
        run: python tests/test_flows.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: App self-test
        run: python main.py --selftest
        env:
          QT_QPA_PLATFORM: offscreen
